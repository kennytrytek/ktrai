name: AI Code Review (Scheduled Catch-up)

# Backstop for PRs that slipped through the event-driven workflow —
# e.g. PRs opened while GHA was down, or that hit GitHub's search index lag.
# Runs hourly and reviews any open PR that hasn't received an AI review yet.

on:
  # Commented out because I don't actually want to run a scheduled cron on this repo.
  # schedule:
  #   - cron: '0 * * * *'  # top of every hour
  workflow_dispatch:       # allow manual trigger for testing or catch-up

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  scheduled-review:
    uses: Workiva/gha-ai-code-review/.github/workflows/ai-code-review-scheduled.yml@0.1.80
    secrets:
      ENG_OPS_JIRA_TOKEN: ${{ secrets.ENG_OPS_JIRA_TOKEN }}
      AI_CODE_REVIEW_AWS_ACCESS_KEY: ${{ secrets.AI_CODE_REVIEW_AWS_ACCESS_KEY }}
      AI_CODE_REVIEW_AWS_SECRET_KEY: ${{ secrets.AI_CODE_REVIEW_AWS_SECRET_KEY }}
      AI_CODE_REVIEW_BEDROCK_MODEL_HAIKU: ${{ secrets.AI_CODE_REVIEW_BEDROCK_MODEL_HAIKU }}
      AI_CODE_REVIEW_BEDROCK_MODEL_SONNET: ${{ secrets.AI_CODE_REVIEW_BEDROCK_MODEL_SONNET }}
      AI_CODE_REVIEW_BEDROCK_MODEL_OPUS: ${{ secrets.AI_CODE_REVIEW_BEDROCK_MODEL_OPUS }}
      BAYMAX_SLACK_BOT_TOKEN: ${{ secrets.BAYMAX_SLACK_BOT_TOKEN }}
      SUPPORT_INFOSEC_CHANNEL_ID: ${{ secrets.SUPPORT_INFOSEC_CHANNEL_ID }}
    with:
      file-patterns: |
        *.go
        *.yaml
        *.yml
        *.md
        *.sh
      excluded-patterns: |
        go.sum
        **/go.sum
        **/vendor/**
        **/testdata/**
      # skill-mappings routes changed files to the appropriate review skill.
      # The catch-all "**" sends every PR to the ci-review skill, which lives
      # at .agent/skills/ci-review/SKILL.md (symlinked from .claude/skills/).
      # Add path-specific entries above "**" to use a different skill for
      # certain file patterns, e.g.:
      #   packages/migrations/** -> .claude/skills/migrations/SKILL.md
      skill-mappings: |
        ** -> .claude/skills/ci-review/SKILL.md
      # Optional overrides (defaults shown):
      # max-reviews: 20    # circuit breaker — max PRs to review per run
      # max-parallel: 2    # review this many PRs concurrently
